# Host nginx site for Personal Messenger. Install as
#   /etc/nginx/sites-available/chat.rahmattomy.com  (+ symlink in sites-enabled)
# Certificates come from certbot (see docs/operations.md). The app container
# listens on 127.0.0.1:8080 (APP_PORT in .env).

upstream personal_messenger {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Needed so WebSocket upgrades pass through and normal requests keep alive.
map $http_upgrade $pm_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.rahmattomy.com;

    # certbot HTTP-01 renewals, then everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.rahmattomy.com;

    ssl_certificate     /etc/letsencrypt/live/chat.rahmattomy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.rahmattomy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Messages are capped at 4000 characters; the API rejects bodies over 32 KB.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://personal_messenger;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /ws {
        proxy_pass http://personal_messenger;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $pm_connection_upgrade;
        # The server pings every 30 s; allow idle sockets well beyond that.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering off;
    }
}
